<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedicineTracker</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/app.css">

<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A simple medicine reminder and pill identification app.">

<!-- SVG first: browsers that understand it get one crisp file at any size. The
     32px PNG is the fallback for those that ignore SVG icons. Both are built
     from the same mark as the home-screen icons (icons/make-icons.py). -->
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">

<!-- iOS ignores manifest icons for Add to Home Screen. -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MedicineTracker">
</head>
<body>

<main id="app" tabindex="-1"></main>

<nav id="bottomnav" hidden></nav>

<!-- Overlay hosts: photo viewer, sheets, dialogs, toasts. -->
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <p style="padding:1.5rem;font:1.25rem system-ui">
    This app needs JavaScript switched on.
  </p>
</noscript>

<script type="module" src="./js/main.js"></script>
</body>
</html>
