rsor: pointer\">Clear<\u002Fbutton>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <div style=\"border-top: 1px solid #EEF0F4; padding: 12px 14px; display: flex; gap: 8px; background: #FAFBFC\">\n                          <sc-if value=\"{{ s.notAllDone }}\">\n                            <button type=\"button\" sc-camel-on-click=\"{{ s.onMarkAll }}\" style=\"flex: 1; min-height: 44px; border: 1px solid #2A3B5E; border-radius: 8px; background: #fff; color: #2A3B5E; font-size: 14px; font-weight: 700; cursor: pointer\">Mark the whole slot<\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ s.allDone }}\">\n                            <button type=\"button\" sc-camel-on-click=\"{{ s.onUndoAll }}\" style=\"flex: 1; min-height: 44px; border: 1px solid #C7CCD6; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Undo the whole slot<\u002Fbutton>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex: none; display: flex; gap: 4px; padding: 8px 8px 16px; border-top: 1px solid #E1E4EA; background: #FFFFFF\">\n              <sc-for list=\"{{ sNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 52px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSCal }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 12px 10px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onPrevMonth }}\" style=\"min-width: 44px; min-height: 44px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 16px; font-weight: 700; cursor: pointer\">‹<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onJump }}\" style=\"flex: 1; min-height: 44px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 17px; font-weight: 800; cursor: pointer\">{{ monthLabel }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onNextMonth }}\" style=\"min-width: 44px; min-height: 44px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 16px; font-weight: 700; cursor: pointer\">›<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ calLoading }}\">\n              <div style=\"flex: 1; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px\">\n                <span style=\"font-size: 14px; color: #6B7280\">Loading the record…<\u002Fspan>\n                <span style=\"height: 220px; border-radius: 12px; background: #EEF0F4; display: block\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ calError }}\">\n              <div style=\"flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n                <div style=\"padding: 14px; border-radius: 10px; background: #FDECE8; border: 1px solid #B14A34; display: flex; flex-direction: column; gap: 8px\">\n                  <span style=\"font-size: 15px; font-weight: 700; color: #8E2F1E\">The record could not be loaded<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 1.45; color: #45423C\">Nothing was lost. This is a reading problem, not a saving problem.<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onRetryCal }}\" style=\"align-self: flex-start; min-height: 40px; padding: 6px 14px; border: none; border-radius: 8px; background: #8E2F1E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Try again<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ calEmpty }}\">\n              <div style=\"flex: 1; padding: 24px 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center\">\n                <span style=\"font-size: 19px; font-weight: 800\">Nothing recorded yet<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.5; color: #4B5563\">Once medicines are added and the first day is marked, it will appear here. Days stay readable forever; the last seven days can still be corrected.<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.sMedForm }}\" style=\"align-self: flex-start; min-height: 44px; padding: 8px 16px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Add the first medicine<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ calMonth }}\">\n              <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"display: flex; gap: 4px\">\n                  <sc-for list=\"{{ calWeekdays }}\" as=\"w\" hint-placeholder-count=\"7\">\n                    <span style=\"flex: 1; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #6B7280\">{{ w.name }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-for list=\"{{ calWeeks }}\" as=\"w\" hint-placeholder-count=\"5\">\n                  <div style=\"display: flex; gap: 4px\">\n                    <sc-for list=\"{{ w.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                      <sc-if value=\"{{ d.blank }}\"><span style=\"flex: 1\"><\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ d.notToday }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ d.onOpen }}\" style=\"flex: 1; min-height: 52px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{ d.bg }}; color: {{ d.fg }}; border: 1px solid {{ d.line }}\">\n                          <span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums\">{{ d.num }}<\u002Fspan>\n                          <span style=\"font-size: 11px; font-weight: 800; line-height: 1\">{{ d.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ d.isToday }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ d.onOpen }}\" style=\"flex: 1; min-height: 52px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{ d.bg }}; color: {{ d.fg }}; border: 3px solid #2A3B5E\">\n                          <span style=\"font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums\">{{ d.num }}<\u002Fspan>\n                          <span style=\"font-size: 11px; font-weight: 800; line-height: 1\">{{ d.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"margin-top: 4px; padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E1E4EA; display: flex; flex-direction: column; gap: 7px\">\n                  <span style=\"font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #6B7280\">What the marks mean<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #374151\"><strong>✓<\u002Fstrong> every medicine dealt with · <strong>○<\u002Fstrong> something still unmarked · <strong>—<\u002Fstrong> something not taken · <strong>·<\u002Fstrong> nothing was due<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #374151\"><strong>▣<\u002Fstrong> before the mark = a read-only record, older than a week and no longer editable · plain white with no mark = a future day, not markable<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #6B7280\">No scores, no streaks — just what happened.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex: none; display: flex; gap: 4px; padding: 8px 8px 16px; border-top: 1px solid #E1E4EA; background: #FFFFFF\">\n              <sc-for list=\"{{ sNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 52px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSCalDay }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; padding: 2px 14px 10px; display: flex; flex-direction: column; gap: 4px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.sCal }}\" style=\"align-self: flex-start; min-height: 44px; padding: 6px 8px; border: none; background: none; color: #2A3B5E; font-size: 15px; font-weight: 700; cursor: pointer\">‹ September 2026<\u002Fbutton>\n              <span style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.02em; padding: 0 4px\">{{ dayLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px\">\n              <sc-if value=\"{{ dayLocked }}\">\n                <div style=\"padding: 12px 14px; border-radius: 10px; background: #ECEBEE; border: 1px solid #BEC0C7; display: flex; gap: 10px\">\n                  <span style=\"font-size: 14px; font-weight: 800; color: #3F4048\">▣<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 1.45; color: #3F4048\">Kept as a record. Days older than a week cannot be changed — you can still read everything and open the medicines.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dayFuture }}\">\n                <div style=\"padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px dashed #C7CCD6; display: flex; gap: 10px\">\n                  <span style=\"font-size: 14px; line-height: 1.45; color: #4B5563\">This day has not happened yet. You can see what is planned, but nothing can be marked.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dayEditable }}\">\n                <div style=\"padding: 10px 14px; border-radius: 10px; background: #EEF1F6; border: 1px solid #C4CCDD\">\n                  <span style=\"font-size: 13px; color: #2A3B5E; font-weight: 600\">You can still correct this day.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dayNoMeds }}\">\n                <div style=\"padding: 18px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E4EA; display: flex; flex-direction: column; gap: 6px\">\n                  <span style=\"font-size: 17px; font-weight: 800\">No medicines were due<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 1.45; color: #4B5563\">Nothing was scheduled on this day, so there is nothing to mark.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ daySlots }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E4EA; overflow: hidden\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: {{ s.bg }}\">\n                    <span style=\"width: 24px; height: 24px; border-radius: 999px; border: 2px solid {{ s.fg }}; color: {{ s.fg }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800\">{{ s.glyph }}<\u002Fspan>\n                    <span style=\"font-size: 16px; font-weight: 700\">{{ s.name }} · {{ s.t }}<\u002Fspan>\n                    <span style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: {{ s.fg }}\">{{ s.statusLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ s.meds }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <div style=\"border-top: 1px solid #EEF0F4; padding: 12px 14px; display: flex; align-items: center; gap: 10px\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ m.onOpen }}\" style=\"flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: none; background: none; padding: 0; cursor: pointer; text-align: left\">\n                        <span style=\"width: 36px; height: 36px; flex: none; border-radius: 8px; border: 1px solid #DDE1E8; background: repeating-linear-gradient(45deg, #F3F4F7 0 5px, #E9EBF0 5px 10px)\"><\u002Fspan>\n                        <span style=\"display: flex; flex-direction: column\">\n                          <span style=\"font-size: 15px; font-weight: 700\">{{ m.name }} {{ m.strength }}<\u002Fspan>\n                          <span style=\"font-size: 13px; color: {{ m.fg }}; font-weight: 600\">{{ m.glyph }} {{ m.statusLabel }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                      <sc-if value=\"{{ dayEditable }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ m.onMark }}\" style=\"flex: none; min-height: 40px; padding: 6px 10px; border: 1px solid #2A3B5E; border-radius: 8px; background: #fff; color: #2A3B5E; font-size: 13px; font-weight: 700; cursor: pointer\">Change<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex: none; display: flex; gap: 4px; padding: 8px 8px 16px; border-top: 1px solid #E1E4EA; background: #FFFFFF\">\n              <sc-for list=\"{{ sNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 52px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isSMeds }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; padding: 2px 14px 10px; display: flex; align-items: center; gap: 10px\">\n              <span style=\"font-size: 23px; font-weight: 800; letter-spacing: -0.02em\">Medicines<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.sMedForm }}\" style=\"margin-left: auto; min-height: 44px; padding: 8px 16px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Add medicine<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ medsLoading }}\">\n              <div style=\"flex: 1; padding: 4px 14px; display: flex; flex-direction: column; gap: 8px\">\n                <span style=\"font-size: 14px; color: #6B7280\">Loading medicines…<\u002Fspan>\n                <span style=\"height: 68px; border-radius: 12px; background: #EEF0F4; display: block\"><\u002Fspan>\n                <span style=\"height: 68px; border-radius: 12px; background: #F1F3F6; display: block\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ medsEmpty }}\">\n              <div style=\"flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; justify-content: center\">\n                <span style=\"font-size: 20px; font-weight: 800\">No medicines yet<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.5; color: #4B5563\">Add the first medicine with a photo of the pill and the packet. Margaret's Today screen stays empty until then, and it tells her you are setting things up.<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.sMedForm }}\" style=\"align-self: flex-start; min-height: 46px; padding: 10px 18px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer\">Add the first medicine<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ medsActive }}\">\n              <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px\">\n                <sc-for list=\"{{ activeMeds }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div style=\"border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E4EA; display: flex; align-items: center; gap: 10px; padding: 12px\">\n                    <span style=\"width: 44px; height: 44px; flex: none; border-radius: 8px; border: 1px solid #DDE1E8; background: repeating-linear-gradient(45deg, #F3F4F7 0 5px, #E9EBF0 5px 10px)\"><\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onOpen }}\" style=\"flex: 1; min-width: 0; border: none; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px\">\n                      <span style=\"font-size: 16px; font-weight: 700\">{{ m.name }} {{ m.strength }}<\u002Fspan>\n                      <span style=\"font-size: 13px; color: #4B5563\">{{ m.sched }}<\u002Fspan>\n                      <span style=\"font-size: 12px; font-weight: 700; color: #6B7280\">{{ m.photoState }}<\u002Fspan>\n                    <\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onArchive }}\" style=\"flex: none; min-height: 40px; padding: 6px 10px; border: 1px solid #C7CCD6; border-radius: 8px; background: #fff; font-size: 12px; font-weight: 700; cursor: pointer\">Archive<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <button type=\"button\" sc-camel-on-click=\"{{ onToggleArchived }}\" style=\"align-self: flex-start; margin-top: 4px; min-height: 44px; padding: 8px 12px; border: none; background: none; color: #2A3B5E; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer\">{{ archivedLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ medsShowArchived }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                    <sc-for list=\"{{ archivedMeds }}\" as=\"a\" hint-placeholder-count=\"1\">\n                      <div style=\"border-radius: 12px; background: #F1F2F5; border: 1px dashed #C7CCD6; display: flex; align-items: center; gap: 10px; padding: 12px\">\n                        <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1\"><span style=\"font-size: 15px; font-weight: 700; color: #4B5563\">{{ a.name }} {{ a.strength }}<\u002Fspan><span style=\"font-size: 12px; color: #6B7280\">{{ a.note }}<\u002Fspan><\u002Fspan>\n                        <button type=\"button\" sc-camel-on-click=\"{{ a.onRestore }}\" style=\"min-height: 40px; padding: 6px 12px; border: 1px solid #2A3B5E; border-radius: 8px; background: #fff; color: #2A3B5E; font-size: 13px; font-weight: 700; cursor: pointer\">Restore<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <span style=\"font-size: 13px; color: #6B7280\">Archived medicines stay out of Today and out of the pill box, but their past record is kept.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex: none; display: flex; gap: 4px; padding: 8px 8px 16px; border-top: 1px solid #E1E4EA; background: #FFFFFF\">\n              <sc-for list=\"{{ sNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 52px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSForm }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 10px 10px; border-bottom: 1px solid #E1E4EA\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.sMeds }}\" style=\"min-height: 44px; padding: 8px 10px; border: none; background: none; color: #2A3B5E; font-size: 15px; font-weight: 700; cursor: pointer\">Cancel<\u002Fbutton>\n              <span style=\"font-size: 16px; font-weight: 800\">Edit medicine<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onSaveMed }}\" style=\"margin-left: auto; min-height: 44px; padding: 8px 16px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Save<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px\">\n              <sc-if value=\"{{ formSaving }}\">\n                <div style=\"padding: 12px 14px; border-radius: 10px; background: #EEF1F6; border: 1px solid #C4CCDD; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-size: 14px; font-weight: 700\">Saving…<\u002Fspan><span style=\"height: 6px; border-radius: 999px; background: #D8DCE4; display: block; overflow: hidden\"><span style=\"display: block; width: 55%; height: 100%; background: #2A3B5E\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ formErrors }}\">\n                <div style=\"padding: 14px; border-radius: 10px; background: #FDECE8; border: 1px solid #B14A34; display: flex; flex-direction: column; gap: 6px\">\n                  <span style=\"font-size: 14px; font-weight: 800; color: #8E2F1E\">Four things need fixing before this can be saved<\u002Fspan>\n                  <span style=\"font-size: 13px; line-height: 1.5; color: #45423C\">A name is needed · the dose must be a number above zero · at least one schedule is needed · “every few days” needs a starting date<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280\">What it is<\u002Fspan>\n                <label for=\"mname\" style=\"font-size: 13px; font-weight: 700; color: #374151\">Name<\u002Flabel>\n                <sc-if value=\"{{ formClean }}\">\n                  <div id=\"mname\" style=\"min-height: 48px; border-radius: 10px; border: 1px solid #C7CCD6; background: #fff; padding: 12px 14px; font-size: 16px\">Metformin<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ formErrors }}\">\n                  <div id=\"mname\" style=\"min-height: 48px; border-radius: 10px; border: 2px solid #B14A34; background: #fff; padding: 12px 14px; font-size: 16px; color: #9CA3AF\">Type the name as it is written on the packet<\u002Fdiv>\n                  <span style=\"font-size: 13px; font-weight: 700; color: #8E2F1E\">A name is needed — this is what Margaret will read.<\u002Fspan>\n                <\u002Fsc-if>\n                <div style=\"display: flex; gap: 8px\">\n                  <span style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; font-weight: 700; color: #374151\">Strength<\u002Fspan><span style=\"min-height: 48px; border-radius: 10px; border: 1px solid #C7CCD6; background: #fff; padding: 12px 14px; font-size: 16px\">500 mg<\u002Fspan><\u002Fspan>\n                  <span style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; font-weight: 700; color: #374151\">How many<\u002Fspan><span style=\"min-height: 48px; border-radius: 10px; border: 1px solid #C7CCD6; background: #fff; padding: 12px 14px; font-size: 16px\">1<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 13px; font-weight: 700; color: #374151\">Form<\u002Fspan>\n                <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #2A3B5E; color: #fff; font-size: 13px; font-weight: 700\">Tablet<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Capsule<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Liquid<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Drops<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Inhaler<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Patch<\u002Fspan>\n                  <span style=\"padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 13px; font-weight: 600\">Other<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 13px; font-weight: 700; color: #374151\">What it is for (Margaret sees this)<\u002Fspan>\n                <span style=\"min-height: 48px; border-radius: 10px; border: 1px solid #C7CCD6; background: #fff; padding: 12px 14px; font-size: 16px\">Blood sugar<\u002Fspan>\n                <span style=\"font-size: 13px; font-weight: 700; color: #374151\">Notes<\u002Fspan>\n                <span style=\"min-height: 72px; border-radius: 10px; border: 1px solid #C7CCD6; background: #fff; padding: 12px 14px; font-size: 16px\">Take with food.<\u002Fspan>\n                <span style=\"font-size: 12px; color: #6B7280; line-height: 1.45\">Write only what helps her take it. CarePair does not check doses or interactions.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280\">Photos<\u002Fspan>\n                <div style=\"display: flex; gap: 8px\">\n                  <div style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\">\n                    <sc-if value=\"{{ formUploading }}\">\n                      <span style=\"height: 110px; border-radius: 10px; border: 1px solid #C7CCD6; background: #EEF0F4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #4B5563\">Uploading… 60%<\u002Fspan>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ formUploadFail }}\">\n                      <span style=\"height: 110px; border-radius: 10px; border: 2px solid #B14A34; background: #FDECE8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #8E2F1E; text-align: center; padding: 8px\">Photo failed<span style=\"font-size: 11px; font-weight: 600; color: #45423C\">too large to process<\u002Fspan><\u002Fspan>\n                    <\u002Fsc-if>\n                    <button type=\"button\" sc-camel-on-click=\"{{ onCurPill }}\" style=\"height: 110px; border-radius: 10px; border: 1px solid #C7CCD6; background: repeating-linear-gradient(45deg, #F3F4F7 0 6px, #E9EBF0 6px 12px); cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4B5563\">pill photo<\u002Fbutton>\n                    <span style=\"font-size: 12px; color: #4B5563\">Pill photo · <button type=\"button\" sc-camel-on-click=\"{{ onSuggestPhoto }}\" style=\"border: none; background: none; padding: 0; color: #2A3B5E; font-size: 12px; font-weight: 700; text-decoration: underline; cursor: pointer\">share with others<\u002Fbutton><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ onCurPacket }}\" style=\"height: 110px; border-radius: 10px; border: 1px dashed #C7CCD6; background: #FFFFFF; cursor: pointer; font-size: 12px; font-weight: 700; color: #2A3B5E\">Add packet photo<\u002Fbutton>\n                    <span style=\"font-size: 12px; color: #6B7280\">No packet photo yet<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCommunity }}\" style=\"min-height: 46px; border: 1px solid #2A3B5E; border-radius: 10px; background: #fff; color: #2A3B5E; font-size: 14px; font-weight: 700; cursor: pointer\">Look it up in the shared list<\u002Fbutton>\n                <span style=\"font-size: 12px; color: #6B7280; line-height: 1.45\">Optional. It only ever fills in the name, strength and photos — you can ignore it and type everything yourself.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280\">When she takes it<\u002Fspan>\n                <sc-for list=\"{{ schedules }}\" as=\"sc\" hint-placeholder-count=\"2\">\n                  <div style=\"border-radius: 12px; background: #fff; border: 1px solid #E1E4EA; padding: 12px; display: flex; flex-direction: column; gap: 10px\">\n                    <div style=\"display: flex; align-items: center; gap: 8px\">\n                      <span style=\"font-size: 15px; font-weight: 700\">{{ sc.kind }}<\u002Fspan>\n                      <button type=\"button\" sc-camel-on-click=\"{{ sc.onRemove }}\" style=\"margin-left: auto; min-height: 40px; padding: 6px 10px; border: 1px solid #C7CCD6; border-radius: 8px; background: #fff; font-size: 12px; font-weight: 700; cursor: pointer\">Remove<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n                      <span style=\"padding: 7px 12px; border-radius: 999px; background: #2A3B5E; color: #fff; font-size: 12px; font-weight: 700\">Every day<\u002Fspan>\n                      <span style=\"padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 12px; font-weight: 600\">Every few days<\u002Fspan>\n                      <span style=\"padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid #C7CCD6; font-size: 12px; font-weight: 600\">Certain weekdays<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 8px\">\n                      <span style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 12px; font-weight: 700; color: #374151\">Time of day<\u002Fspan><span style=\"min-height: 44px; border-radius: 8px; border: 1px solid #C7CCD6; background: #fff; padding: 10px 12px; font-size: 15px\">{{ sc.slot }}<\u002Fspan><\u002Fspan>\n                      <span style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 12px; font-weight: 700; color: #374151\">Exact time (optional)<\u002Fspan><span style=\"min-height: 44px; border-radius: 8px; border: 1px solid #C7CCD6; background: #fff; padding: 10px 12px; font-size: 15px\">{{ sc.time }}<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ formErrors }}\">\n                  <div style=\"border-radius: 12px; background: #fff; border: 2px solid #B14A34; padding: 12px; display: flex; flex-direction: column; gap: 8px\">\n                    <span style=\"font-size: 15px; font-weight: 700\">Every few days<\u002Fspan>\n                    <span style=\"font-size: 13px; font-weight: 700; color: #8E2F1E\">Choose the day it starts from, otherwise we cannot work out which days it falls on.<\u002Fspan>\n                    <span style=\"min-height: 44px; border-radius: 8px; border: 2px solid #B14A34; background: #fff; padding: 10px 12px; font-size: 15px; color: #9CA3AF\">Starting date<\u002Fspan>\n                    <span style=\"font-size: 13px; font-weight: 700; color: #8E2F1E\">Also: pick at least one weekday for the third schedule.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <button type=\"button\" sc-camel-on-click=\"{{ onAddSchedule }}\" style=\"min-height: 46px; border: 1px dashed #2A3B5E; border-radius: 10px; background: #fff; color: #2A3B5E; font-size: 14px; font-weight: 700; cursor: pointer\">Add another time<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.sTimes }}\" style=\"min-height: 40px; border: none; background: none; color: #2A3B5E; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; align-self: flex-start\">The time of day I need is not in the list<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid #E1E4EA\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onSaveInvalid }}\" style=\"min-height: 40px; border: none; background: none; color: #6B7280; font-size: 12px; text-decoration: underline; cursor: pointer; align-self: flex-start\">demo: try saving with things missing<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.sMeds }}\" style=\"min-height: 46px; border: 1px solid #8E2F1E; border-radius: 10px; background: #fff; color: #8E2F1E; font-size: 14px; font-weight: 700; cursor: pointer\">Archive this medicine…<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSTimes }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 10px 10px; border-bottom: 1px solid #E1E4EA\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.sSettings }}\" style=\"min-height: 44px; padding: 8px 10px; border: none; background: none; color: #2A3B5E; font-size: 15px; font-weight: 700; cursor: pointer\">Back<\u002Fbutton>\n              <span style=\"font-size: 16px; font-weight: 800\">Times of day<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onSaveTimes }}\" style=\"margin-left: auto; min-height: 44px; padding: 8px 16px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Save<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 14px; line-height: 1.5; color: #4B5563\">These are the words Margaret sees on her Today screen, and the compartments in the pill box. Keep them few and obvious.<\u002Fspan>\n              <sc-for list=\"{{ timeRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"border-radius: 12px; background: #fff; border: 1px solid #E1E4EA; padding: 12px; display: flex; flex-direction: column; gap: 10px\">\n                  <div style=\"display: flex; gap: 8px\">\n                    <span style=\"flex: 2; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 12px; font-weight: 700; color: #374151\">Name<\u002Fspan><span style=\"min-height: 44px; border-radius: 8px; border: 1px solid #C7CCD6; background: #fff; padding: 10px 12px; font-size: 16px; font-weight: 600\">{{ t.name }}<\u002Fspan><\u002Fspan>\n                    <span style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 12px; font-weight: 700; color: #374151\">Time<\u002Fspan><span style=\"min-height: 44px; border-radius: 8px; border: 1px solid #C7CCD6; background: #fff; padding: 10px 12px; font-size: 16px\">{{ t.t }}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 10px\">\n                    <span style=\"font-size: 12px; color: #6B7280\">{{ t.uses }}<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.onRemove }}\" style=\"margin-left: auto; min-height: 40px; padding: 6px 10px; border: 1px solid #8E2F1E; border-radius: 8px; background: #fff; color: #8E2F1E; font-size: 12px; font-weight: 700; cursor: pointer\">Remove<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button type=\"button\" sc-camel-on-click=\"{{ onAddSlot }}\" style=\"min-height: 48px; border: 1px dashed #2A3B5E; border-radius: 10px; background: #fff; color: #2A3B5E; font-size: 14px; font-weight: 700; cursor: pointer\">Add a time of day<\u002Fbutton>\n              <span style=\"font-size: 12px; color: #6B7280\">At least one time of day must stay.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSSettings }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; padding: 2px 14px 10px\"><span style=\"font-size: 23px; font-weight: 800; letter-spacing: -0.02em\">Settings<\u002Fspan><\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 18px\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                <span style=\"font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280\">Connection<\u002Fspan>\n                <div style=\"border-radius: 12px; background: #fff; border: 1px solid #E1E4EA; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n                  <span style=\"font-size: 16px; font-weight: 700\">Margaret's household<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #4B5563\">Connected on 2 August with code K7F2QM. You are her only helper.<\u002Fspan>\n
