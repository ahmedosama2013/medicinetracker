camel-on-click=\"{{ onNextMonth }}\" style=\"min-width: 44px; min-height: 44px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 16px; cursor: pointer\">+<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Jan<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Feb<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Mar<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Apr<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">May<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Jun<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Jul<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Aug<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 2px solid #2A3B5E; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Sep<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Oct<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Nov<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 48px; border: 1px solid #DDE1E8; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Dec<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showBoxTimes }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(28,26,23,0.45); display: flex; align-items: flex-end; z-index: 20\">\n            <div style=\"width: 100%; background: #FBF9F5; border-radius: 24px 24px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n              <span style=\"font-size: 22px; font-weight: 800\">Which compartments does the box have?<\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.45; color: #45423C\">Tick the times of day that exist as compartments in the plastic box.<\u002Fspan>\n              <sc-for list=\"{{ boxTimeOptions }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ b.onToggle }}\" style=\"min-height: 62px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; cursor: pointer; text-align: left; background: {{ b.bg }}; border: 2px solid {{ b.line }}\">\n                  <span style=\"width: 30px; height: 30px; flex: none; border-radius: 8px; border: 2px solid #1F5340; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #1F5340; background: #fff\">{{ b.glyph }}<\u002Fspan>\n                  <span style=\"font-size: 19px; font-weight: 700\">{{ b.name }}<\u002Fspan>\n                  <span style=\"margin-left: auto; font-size: 17px; color: #55514A\">{{ b.t }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 60px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 18px; font-weight: 800; cursor: pointer\">Done<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showShare }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(28,26,23,0.45); display: flex; align-items: flex-end; z-index: 20\">\n            <div style=\"width: 100%; background: #FBF9F5; border-radius: 24px 24px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n              <span style=\"font-size: 21px; font-weight: 800\">Send your code to your helper<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCopyCode }}\" style=\"min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; border: 2px solid #211F1B; background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left\">WhatsApp<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCopyCode }}\" style=\"min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; border: 2px solid #211F1B; background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left\">Text message<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCopyCode }}\" style=\"min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; border: 2px solid #211F1B; background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left\">Copy the code<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 56px; border: none; border-radius: 16px; background: #F2EEE6; font-size: 17px; font-weight: 700; cursor: pointer\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showOutside }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(28,26,23,0.45); display: flex; align-items: flex-end; z-index: 20\">\n            <div style=\"width: 100%; background: #FBF9F5; border-radius: 24px 24px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n              <span style=\"font-size: 24px; font-weight: 800; letter-spacing: -0.02em\">These stay out of the box<\u002Fspan>\n              <sc-for list=\"{{ outsideBox }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <div style=\"padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 3px solid #DDD7CB; display: flex; flex-direction: column; gap: 3px\">\n                  <span style=\"font-size: 21px; font-weight: 800\">{{ o.name }}<\u002Fspan>\n                  <span style=\"font-size: 18px; color: #45423C\">{{ o.dose }}<\u002Fspan>\n                  <span style=\"font-size: 18px; font-weight: 700; color: #7A5410\">{{ o.reason }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button type=\"button\" sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"min-height: 62px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 19px; font-weight: 800; cursor: pointer\">Done<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showPhoto }}\">\n          <div style=\"position: absolute; inset: 0; background: #14120F; display: flex; flex-direction: column; z-index: 30\">\n            <div style=\"flex: none; display: flex; align-items: center; padding: 16px 18px\">\n              <span style=\"font-size: 17px; font-weight: 700; color: #F5F1E8\">{{ photoLabel }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onClosePhoto }}\" style=\"margin-left: auto; min-height: 52px; padding: 10px 20px; border: 2px solid #F5F1E8; border-radius: 14px; background: transparent; color: #F5F1E8; font-size: 17px; font-weight: 700; cursor: pointer\">Close<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px\">\n              <span style=\"width: 100%; height: 100%; border-radius: 18px; background: repeating-linear-gradient(45deg, #2B2721 0 12px, #211E19 12px 24px); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A39B8C; text-align: center; padding: 20px\">full-size photo<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"flex: none; padding: 14px 20px 28px; font-size: 17px; line-height: 1.45; color: #DCD5C8\">{{ photoCaption }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDialog }}\">\n          <div style=\"position: absolute; inset: 0; background: rgba(28,26,23,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40\">\n            <div style=\"width: 100%; background: #FBF9F5; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.3)\">\n              <span style=\"font-size: 23px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2\">{{ dlgTitle }}<\u002Fspan>\n              <span style=\"font-size: 17px; line-height: 1.5; color: #45423C\">{{ dlgBody }}<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onDlgConfirm }}\" style=\"min-height: 60px; border: none; border-radius: 14px; color: #FBF9F5; font-size: 18px; font-weight: 800; cursor: pointer; background: {{ dlgBg }}\">{{ dlgConfirm }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onDlgCancel }}\" style=\"min-height: 56px; border: 2px solid #B9B2A3; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">{{ dlgCancel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showToast }}\">\n          <div style=\"position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #211F1B; box-shadow: 0 10px 30px rgba(0,0,0,0.3)\">\n            <span style=\"font-size: 17px; font-weight: 700; color: #FBF9F5; line-height: 1.3\">{{ toastText }}<\u002Fspan>\n            <sc-if value=\"{{ toastUndo }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onToastUndo }}\" style=\"margin-left: auto; flex: none; min-height: 44px; padding: 8px 16px; border: 2px solid #FBF9F5; border-radius: 12px; background: transparent; color: #FBF9F5; font-size: 16px; font-weight: 800; cursor: pointer\">Undo<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #55514A\"><strong style=\"font-weight: 700\">{{ screenName }}<\u002Fstrong> — {{ purpose }}<\u002Fp>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n        <sc-for list=\"{{ variants }}\" as=\"v\" hint-placeholder-count=\"0\">\n          <button type=\"button\" sc-camel-on-click=\"{{ v.onPick }}\" style=\"min-height: 34px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #B9B2A3; background: {{ v.bg }}; color: {{ v.fg }}\">{{ v.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.onPick }}\" style=\"min-height: 40px; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid #211F1B; background: {{ t.bg }}; color: {{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tabMap }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px\">\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #45423C; max-width: 62ch\">Tap any screen to load it in the phone. The chips under the phone switch that screen between its empty, loading, offline and error states. Everything marks, undoes, confirms and toasts for real.<\u002Fp>\n          <sc-for list=\"{{ mapGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7C766A\">{{ g.title }}<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ i.onGo }}\" style=\"display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-height: 46px; padding: 11px 14px; border-radius: 12px; border: 1px solid #C9C2B3; cursor: pointer; text-align: left; background: {{ i.bg }}; color: {{ i.fg }}\">\n                    <span style=\"font-size: 15px; font-weight: 700\">{{ i.label }}<\u002Fspan>\n                    <span style=\"font-size: 13px; opacity: 0.75\">{{ i.note }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSystem }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 70ch\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">Two dialects of one system<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #45423C\">Same components, same colours, same words. What changes between roles is <strong>density and scale<\u002Fstrong>, so the roles feel intentionally different without being two unrelated products.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px\">\n              <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 2px solid #DDD7CB; display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #7C766A\">Taking medicines<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.5; color: #45423C\">Warm paper #FBF9F5 · body 19–21px · titles 28–30px · every target ≥ 56px · 3px borders on every card · 3 nav items · <strong>no scrolling anywhere except Settings<\u002Fstrong> — cards divide the screen with flex instead, so content always fits the first view<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding: 14px; border-radius: 12px; background: #E5E9F0; border: 1px solid #C7CCD6; display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280\">Helping<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.5; color: #374151\">Cool grey #F7F8FA · body 13–15px · titles 22px · targets ≥ 40px · 5 nav items · lists and grids · 1px borders<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">Colour + shape + word, never colour alone<\u002Fh3>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #E7F1EA; border: 2px solid #1F5340; color: #1F5340; font-size: 14px; font-weight: 700\">✓ Taken<\u002Fspan>\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #F2EEE6; border: 2px solid #55514A; color: #55514A; font-size: 14px; font-weight: 700\">○ Not marked yet<\u002Fspan>\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #FBEAE5; border: 2px solid #8E2F1E; color: #8E2F1E; font-size: 14px; font-weight: 700\">! Not taken yet<\u002Fspan>\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #ECEBEE; border: 2px solid #3F4048; color: #3F4048; font-size: 14px; font-weight: 700\">— Not taking today<\u002Fspan>\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #FBF9F5; border: 2px dashed #C5BEAE; color: #7C766A; font-size: 14px; font-weight: 700\">future / not markable<\u002Fspan>\n              <span style=\"padding: 10px 14px; border-radius: 10px; background: #ECEBEE; border: 2px solid #BEC0C7; color: #3F4048; font-size: 14px; font-weight: 700\">▣ read-only record<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #45423C\">Type is Public Sans (chosen for legibility at large sizes and in the smaller helper views) with IBM Plex Mono reserved for codes and photo placeholders. Green #1F5340 means “done or go”; amber #7A5410 means “needs attention, no blame”; red #8E2F1E is used <em>only<\u002Fem> for destructive or overdue, never for a skipped medicine.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">Pattern rules<\u002Fh3>\n            <ul style=\"margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; color: #45423C\">\n              <li>Full screens for places you live in; bottom sheets for things you look at (medicine, compartment, shared list); centre dialogs only for consequences.<\u002Fli>\n              <li>Every state-changing tap produces a toast; anything reversible carries <strong>Undo<\u002Fstrong> in the toast itself.<\u002Fli>\n              <li>Destructive actions are outlined in red, never filled — the filled green button is always the safe one.<\u002Fli>\n              <li>No icon carries meaning alone; the glyphs above are typographic so they scale with text size.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabWhy }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 70ch\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">1 · Today is a single list of times, not a list of medicines<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">A person asks “what do I take now?”, not “how is metformin doing?”. Three time cards fill the screen, the one that is due is the loud one, and a medicine list only appears when a time is opened. Taps to complete the daily task: two.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">2 · Marking is written in the first person<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">“I have taken this” instead of “Mark as taken”, “Not taking this today” instead of “Skip”. It removes the sense of reporting to a system, and it makes the difference from the pill box obvious — that button says “It is in the box”.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">3 · The box flow can never mark a dose<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">Filling has its own vocabulary (“in the box”), its own progress bar labelled as job progress, a blue information band that says so on entry, and no “taken” affordance anywhere in the flow. The check screen shows quantities to compare with the tray and explicitly refuses to certify it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">4 · The helper’s honesty layer<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">The helper is always looking at a copy of someone else’s day, so the top of their Today states how old the data is and offers a manual check. The first mark of a session asks for confirmation and then never asks again — replaced by a quiet persistent chip that reminds them they are acting on her behalf.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">5 · No numbers about the person<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">The only counts in the product are quantities of pills and “2 of 4 in the box”. Days read “all dealt with” or “something still unmarked”; nothing is ever a percentage, a streak or a score, and a skipped medicine is styled neutral grey — not red.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">6 · Undo instead of “are you sure”<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">Dose marking is instant with Undo in the toast — confirmation dialogs are spent only where a tap has consequences outside the phone: rotating the code, signing out, disconnecting, archiving, removing a time of day, and sharing a photo with strangers.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabReview }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 70ch\">\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">Requirements I would change, combine or drop — none of these remove a capability from the brief:<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">Combine “role can be changed in Settings” into one visible escape hatch<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">A role switcher is a trap for the person taking medicines — one wrong tap and they are in an admin app. Kept as a small underlined “Change role” at the very bottom of Settings, below sign-out, rather than a setting row.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">“Mark a whole slot” should not be the primary elder action<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">It is real and reversible, but it lives at the bottom of an opened time card as an outlined button. Making it primary invites marking everything at 8am before anything is swallowed.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">Appearance: drop “Dark” from the elder settings? No — but default to Match system<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">Kept all three, worded as “How it looks”. Low-vision users often need the dark option; the risk is accidental selection, which the ✓-marked list makes visible and one tap to revert.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">Community photo sharing should be opt-in per photo, not a global preference<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">A blanket “share my photos” toggle is a privacy hazard nobody remembers setting. Replaced with a per-photo “share with others” action that carries its own confirmation.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FBF9F5; border: 1px solid #DDD7CB; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">Supporter escalation delay needs a floor, and a name<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">“Escalation delay” is jargon. Worded as “How long to wait first”, framed as alerting the helper — never as a warning aimed at the person taking medicines, who never sees it.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FFF4E0; border: 1px solid #A6741C; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800\">Open question worth your decision<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.55; color: #45423C\">Locked history is set at 7 days here, and the pill-box week starts on Monday. Both are product policy rather than design — tell me the real values and I will change the copy and the calendar rules.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabCheck }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 70ch\">\n          <h3 style=\"margin: 0; font-size: 20px; font-weight: 800\">Could an 80-year-old do the daily task unaided?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">The daily task is: <em>see what is due now and say I took it.<\u002Fem> On the built flow that is <strong>one tap<\u002Fstrong> — “I have taken these” sits on the time card itself, on the first screen, with no scrolling and no navigation. “See the pills” is the second, optional path for when she wants to check the pill against the photo. Delivered as a PWA, so it is the same one-tap screen whether she opens it from the home-screen icon or the browser.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"padding: 14px; border-radius: 12px; background: #E7F1EA; border: 1px solid #1F5340; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800; color: #14362a\">Passes<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.6; color: #1F2937\">No horizontal gestures, no swipe-to-anything, no long-press, no hidden menus, no timeout. Nothing on Today is destructive. Body text is 18px minimum and status is never colour-only. The overdue time card is the only loud thing on screen, so the eye lands on the right card first. Every mark is reversible from the same spot it was made.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 12px; background: #FFF4E0; border: 1px solid #A6741C; display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 15px; font-weight: 800; color: #7A5410\">Residual risks to test with real users<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.6; color: #45423C\">1 · “Not taking this today” could be read as “I am not taking any of these” — worth testing against “Leave this one out today”. 2 · The opened time card scrolls when three or more medicines are in it; scrolling is the only learned behaviour the flow requires. 3 · Undo lives in the toast for four seconds; a slow reader will instead have to re-open the medicine and tap “Undo — I have not taken it”, which works but is a longer path. 4 · If the helper marks a dose remotely while she is looking at the card, the status changes under her; a gentler arrival animation with “your helper marked this” would be the next thing I build.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #45423C\">The pill-box flow is deliberately not part of the daily task. It is a weekly job, it is longer, and it is written for whoever is doing it at the kitchen table — most often the helper, on either phone.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startRole&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Choose at the welcome screen&quot;,&quot;Person taking medicines&quot;,&quot;Helper&quot;],&quot;default&quot;:&quot;Choose at the welcome screen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;lockedAfterDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:30,&quot;unit&quot;:&quot; days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Product rules&quot;},&quot;confirmEveryMark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Product rules&quot;}}\">\nclass Component extends DCLogic {\n  slots = [\n    { id: 'morning', name: 'Morning', t: '8:00 am' },\n    { id: 'midday', name: 'Midday', t: '1:00 pm' },\n    { id: 'evening', name: 'Evening', t: '6:00 pm' },\n    { id: 'night', name: 'Bedtime', t: '9:30 pm' }\n  ];\n  meds = [\n    { id: 'amlo', name: 'Amlodipine', strength: '5 mg', dose: '1 tablet', form: 'Tablet', purpose: 'Blood pressure', notes: 'Take with a glass of water. Sit up for a few minutes afterwards.', repeat: 'Every day', slots: ['morning'], due: true, box: true, photos: 'both', week: 7, per: { morning: 1 }, days: 'Every day, morning' },\n    { id: 'metf', name: 'Metformin', strength: '500 mg', dose: '1 tablet', form: 'Tablet', purpose: 'Blood sugar', notes: 'Take with food.', repeat: 'Every day', slots: ['morning', 'evening'], due: true, box: true, photos: 'both', week: 14, per: { morning: 1, evening: 1 }, days: 'Every day, morning and evening' },\n    { id: 'ator', name: 'Atorvastatin', strength: '20 mg', dose: '1 tablet', form: 'Tablet', purpose: 'Cholesterol', notes: '', repeat: 'Every day', slots: ['night'], due: true, box: true, photos: 'pill', week: 7, per: { night: 1 }, days: 'Every day, bedtime' },\n    { id: 'cole', name: 'Colecalciferol', strength: '800 IU', dose: '1 capsule', form: 'Capsule', purpose: 'Vitamin D', notes: '', repeat: 'Every 3 days, from 14 September', slots: ['morning'], due: false, box: true, photos: 'both', week: 3, per: { morning: 1 }, days: 'Mon 14, Thu 17, Sun 20 — morning' },\n    { id: 'salb', name: 'Salbutamol inhaler', strength: '100 mcg', dose: '2 puffs', form: 'Inhaler', purpose: 'Breathing', notes: 'Shake before use. Rinse your mouth after.', repeat: 'Mondays and Thursdays', slots: ['evening'], due: false, box: false, out: 'Inhalers do not fit the box', photos: 'packet' },\n    { id: 'lata', name: 'Latanoprost drops', strength: '0.005%', dose: '1 drop in each eye', form: 'Drops', purpose: 'Eye pressure', notes: 'Keep the bottle in the fridge.', repeat: 'Every day', slots: ['night'], due: true, box: false, out: 'Drops stay in the fridge', photos: 'packet' }\n  ];\n  state = {\n    screen: 'welcome', role: null, how: 0, signin: 'idle', pair: 'idle', code: '',\n    tab: 'map', openSlot: 'evening', sheet: null, sheetMed: null, sheetComp: null,\n    dialog: null, photo: null, toast: null, onBehalf: false,\n    doses: { 'morning/amlo': 'taken', 'morning/metf': 'taken' },\n    eTodayVar: 'normal', sTodayVar: 'normal', calVar: 'month', medsVar: 'active',\n    formVar: 'clean', fillVar: 'ready', fillIdx: 0, filled: {},\n    boxTimes: { morning: true, midday: false, evening: true, night: true },\n    day: null, theme: 'Match system', reminders: 'on', supNotif: true, esc: '1 hour',\n    timeSlots: [\n      { id: 'morning', name: 'Morning', t: '8:00 am', uses: 3 },\n      { id: 'midday', name: 'Midday', t: '1:00 pm', uses: 0 },\n      { id: 'evening', name: 'Evening', t: '6:00 pm', uses: 2 },\n      { id: 'night', name: 'Bedtime', t: '9:30 pm', uses: 2 }\n    ]\n  };\n\n  // ---- shared behaviour ----\n  toast(text, undo) {\n    clearTimeout(this._tt);\n    this.setState({ toast: { text: text, undo: !!undo, onUndo: undo || null } });\n    this._tt = setTimeout(() => this.setState({ toast: null }), 4200);\n  }\n  closeAll = () => this.setState({ sheet: null, dialog: null, photo: null });\n  openPhoto = (label, caption) => this.setState({ photo: { label: label, caption: caption } });\n  doseKey(slot, med) { return slot + '/' + med; }\n  doseOf(slot, med) { return this.state.doses[this.doseKey(slot, med)] || 'unmarked'; }\n  setDose(slot, medId, status, label) {\n    const key = this.doseKey(slot, medId);\n    const prev = this.state.doses[key] || 'unmarked';\n    const apply = () => {\n      const d = Object.assign({}, this.state.doses);\n      if (status === 'unmarked') { delete d[key]; } else { d[key] = status; }\n      this.setState({ doses: d });\n      this.toast(label, () => {\n        const back = Object.assign({}, this.state.doses);\n        if (prev === 'unmarked') { delete back[key]; } else { back[key] = prev; }\n        this.setState({ doses: back, toast: null });\n      });\n    };\n    const needsOk = !this.state.onBehalf || this.props.confirmEveryMark;\n    if (this.state.role === 'supporter' && needsOk && status !== 'unmarked') {\n      this.setState({ dialog: {\n        title: 'Mark this for Margaret?',\n        body: 'You are recording this on her behalf. It will show on her phone as already dealt with. We will not ask again while you are in the app.',\n        confirm: 'Yes, mark on her behalf', cancel: 'Not now', danger: false,\n        onConfirm: () => { this.setState({ onBehalf: true, dialog: null }); apply(); }\n      } });\n      return;\n    }\n    apply();\n  }\n  slotCards(role) {\n    const s = this.state;\n    const now = 18.66;\n    const at = { morning: 8, midday: 13, evening: 18, night: 21.5 };\n    return this.slots.map(sl => {\n      const ms = this.meds.filter(m => m.due && m.slots.indexOf(sl.id) >= 0);\n      if (!ms.length) return null;\n      const st = ms.map(m => this.doseOf(sl.id, m.id));\n      const marked = st.filter(x => x !== 'unmarked').length;\n      const skipped = st.filter(x => x === 'skipped').length;\n      const late = at[sl.id] < now && marked < ms.length;\n      let key = marked === 0 ? 'open' : (marked < ms.length ? 'part' : 'done');\n      const text = key === 'done' ? (skipped ? 'All dealt with · ' + skipped + ' not taken' : 'All taken') : (key === 'part' ? marked + ' of ' + ms.length + ' dealt with' : (late ? 'Not taken yet' : 'Still to come'));\n      const tone = key === 'done' ? { bg: '#E7F1EA', fg: '#1F5340', line: '#9CC0AC', glyph: '✓' }\n        : late ? { bg: '#FBEAE5', fg: '#8E2F1E', line: '#E0AB9D', glyph: '!' }\n        : { bg: '#F2EEE6', fg: '#55514A', line: '#DDD7CB', glyph: '○' };\n      return {\n        id: sl.id, name: sl.name, t: sl.t, count: ms.length + (ms.length === 1 ? ' medicine' : ' medicines'),\n        medNames: ms.length === 1 ? ms[0].name : (ms.length === 2 ? ms[0].name + ' and ' + ms[1].name : ms[0].name + ' and ' + (ms.length - 1) + ' more'),\n        takeLabel: ms.length === 1 ? 'I have taken it' : 'I have taken these',\n        onOpenPage: () => this.setState({ screen: 'e_slot', openSlot: sl.id }),\n        statusText: text, bg: tone.bg, fg: tone.fg, line: tone.line, glyph: tone.glyph,\n        open: s.openSlot === sl.id, chevron: s.openSlot === sl.id ? 'Hide' : 'Open',\n        onToggle: () => this.setState({ openSlot: s.openSlot === sl.id ? null : sl.id }),\n        allDone: key === 'done', notAllDone: key !== 'done',\n        onMarkAll: () => {\n          const d = Object.assign({}, s.doses);\n          ms.forEach(m => { d[this.doseKey(sl.id, m.id)] = 'taken'; });\n          const before = s.doses;\n          const commit = () => { this.setState({ doses: d }); this.toast('All of ' + sl.name.toLowerCase() + ' marked as taken', () => this.setState({ doses: before, toast: null })); };\n          if (s.role === 'supporter' && !s.onBehalf) {\n            this.setState({ dialog: { title: 'Mark all of ' + sl.name.toLowerCase() + ' for Margaret?', body: 'You are recording ' + ms.length + ' medicines on her behalf. We will not ask again while you are in the app.', confirm: 'Yes, mark on her behalf', cancel: 'Not now', onConfirm: () => { this.setState({ onBehalf: true, dialog: null }); commit(); } } });\n          } else { commit(); }\n        },\n        onUndoAll: () => {\n          const d = Object.assign({}, s.doses); const before = s.doses;\n          ms.forEach(m => { delete d[this.doseKey(sl.id, m.id)]; });\n          this.setState({ doses: d }); this.toast(sl.name + ' marks cleared', () => this.setState({ doses: before, toast: null }));\n        },\n        meds: ms.map(m => {\n          const st2 = this.doseOf(sl.id, m.id);\n          const tone2 = st2 === 'taken' ? { bg: '#E7F1EA', fg: '#1F5340', g: '✓', label: 'Taken' }\n            : st2 === 'skipped' ? { bg: '#ECEBEE', fg: '#3F4048', g: '—', label: 'Not taking today' }\n            : { bg: '#FFFFFF', fg: '#55514A', g: '○', label: 'Not marked yet' };\n          return {\n            key: sl.id + m.id, name: m.name, strength: m.strength, dose: m.dose, purpose: m.purpose,\n            statusLabel: tone2.label, chipBg: tone2.bg, chipFg: tone2.fg, glyph: tone2.g,\n            taken: st2 === 'taken', skipped: st2 === 'skipped', unmarked: st2 === 'unmarked',\n            notTaken: st2 !== 'taken',\n            onOpen: () => this.setState({ sheet: 'med', sheetMed: { med: m, slot: sl.id, slotName: sl.name } }),\n            onTake: () => this.setDose(sl.id, m.id, 'taken', m.name + ' marked as taken'),\n            onClear: () => this.setDose(sl.id, m.id, 'unmarked', m.name + ' mark cleared'),\n            onSkip: () => this.setDose(sl.id, m.id, 'skipped', m.name + ' marked as not taking today')\n          };\n        })\n      };\n    }).filter(Boolean);\n  }\n  go = (screen, extra) => this.setState(Object.assign({ screen: screen }, extra || {}));\n\n  howPages = [\n    { t: 'Pick who you are', b: 'One phone belongs to the person taking the medicines. The other belongs to whoever helps them. Each phone shows only what that person needs.', a: '[ two phones side by side ]' },\n    { t: 'The helper sets things up', b: 'The helper adds each medicine with a photo of the pill and the packet, what it is for, and the times of day it is taken.', a: '[ medicine card with pill + packet photo ]' },\n    { t: 'Follow the day', b: 'The person taking the medicines sees one screen: Morning, Evening, Bedtime. Tap a time to see the medicines, tap a medicine to see the pill.', a: '[ Today screen with three time cards ]' },\n    { t: 'Fill the weekly box', b: 'Once a week, whoever fills the plastic pill box is walked through it one medicine at a time. Filling the box never marks anything as taken.', a: '[ seven-day pill box, three compartments a day ]' }\n  ];\n\n  panelVals() {\n    const s = this.state;\n    const V = {\n      e_today: [['normal', 'Normal day'], ['nonedue', 'Nothing due today'], ['empty', 'No medicines yet'], ['loading', 'Loading'], ['offline', 'Offline / waiting to sync']],\n      s_today: [['normal', 'Normal'], ['stale', 'Data 3 hours old'], ['datediff', 'Phone date differs'], ['loading', 'Refreshing'], ['syncfail', 'Sync failed']],\n      s_cal: [['month', 'Month'], ['loading', 'Loading history'], ['error', 'Could not load'], ['empty', 'No activity yet']],\n      s
