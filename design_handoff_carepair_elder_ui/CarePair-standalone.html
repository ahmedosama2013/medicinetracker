document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; }\n  ::-webkit-scrollbar { width: 6px; height: 6px; }\n  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 4px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"padding: 40px 40px 64px; display: flex; flex-direction: column; gap: 28px\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 78ch\">\n    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #7C766A\">CarePair · mobile product design · navigable mock<\u002Fspan>\n    <h1 style=\"margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.02em\">Two apps, one household<\u002Fh1>\n    <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #55514A; text-wrap: pretty\">The person taking the medicines gets one calm question a day: <em>what do I take now?<\u002Fem> The helper gets everything else. Tap through the phone below — every screen, sheet, dialog, empty, loading and error state is live.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start\">\n\n    <div style=\"display: flex; flex-direction: column; gap: 14px; width: 390px; flex: none\">\n      <div style=\"position: relative; width: 390px; height: 844px; background: #D9D1BF; border: 9px solid #211F1B; border-radius: 48px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 14px rgba(60,50,30,0.12), 0 30px 60px rgba(60,50,30,0.25)\">\n        <div style=\"flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 700; color: #55514A; font-variant-numeric: tabular-nums\">\n          <span>{{ clock }}<\u002Fspan>\n          <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 18px; height: 9px; border: 1.5px solid #55514A; border-radius: 2px; display: inline-block\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 24px 24px 34px\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"width: 52px; height: 52px; border-radius: 16px; background: #1F5340; display: flex; align-items: center; justify-content: center; color: #FBF9F5; font-size: 24px; font-weight: 800\">C<\u002Fspan>\n              <h2 style=\"margin: 8px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1\">CarePair<\u002Fh2>\n              <p style=\"margin: 0; font-size: 20px; line-height: 1.4; color: #55514A\">Medicines, kept simple — for the person taking them and the person helping.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.signin }}\" style=\"min-height: 76px; padding: 14px 22px; border: none; border-radius: 18px; background: #1F5340; color: #FBF9F5; font-size: 22px; font-weight: 700; text-align: left; cursor: pointer\" style-hover=\"background: #17412f\">I take the medicines<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.pair }}\" style=\"min-height: 76px; padding: 14px 22px; border: 2px solid #211F1B; border-radius: 18px; background: #FBF9F5; color: #1C1A17; font-size: 22px; font-weight: 700; text-align: left; cursor: pointer\" style-hover=\"background: #F2EEE6\">I help someone with their medicines<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.how }}\" style=\"min-height: 60px; padding: 12px 22px; border: none; border-radius: 18px; background: transparent; color: #1F5340; font-size: 19px; font-weight: 700; text-decoration: underline; text-align: left; cursor: pointer\">How it works<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 15px; color: #7C766A; line-height: 1.45\">You can change this later in Settings.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isHow }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 18px 14px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.welcome }}\" style=\"min-height: 44px; padding: 8px 14px; border: none; background: none; color: #1F5340; font-size: 17px; font-weight: 700; cursor: pointer\">Close<\u002Fbutton>\n              <span style=\"margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7C766A\">{{ howCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 18px\">\n              <div style=\"flex: none; height: 190px; border-radius: 18px; border: 1px solid #DDD7CB; background: repeating-linear-gradient(45deg, #F2EEE6 0 8px, #E8E3D8 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7C766A; text-align: center; padding: 12px\">{{ howArt }}<\u002Fdiv>\n              <h2 style=\"margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15\">{{ howTitle }}<\u002Fh2>\n              <p style=\"margin: 0; font-size: 19px; line-height: 1.45; color: #45423C\">{{ howBody }}<\u002Fp>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.45; color: #7C766A\">Reading this changes nothing in the app. No medicines are added.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex: none; display: flex; gap: 12px; padding: 12px 20px 22px; border-top: 1px solid #E4DFD4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.howBack }}\" style=\"min-height: 60px; flex: 1; border: 2px solid #211F1B; border-radius: 16px; background: #FBF9F5; font-size: 18px; font-weight: 700; cursor: pointer\">{{ howBackLabel }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.howNext }}\" style=\"min-height: 60px; flex: 2; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 18px; font-weight: 700; cursor: pointer\">{{ howNextLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSignin }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 24px 24px 34px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ nav.welcome }}\" style=\"position: absolute; top: 52px; left: 14px; min-height: 44px; padding: 8px 14px; border: none; background: none; color: #1F5340; font-size: 17px; font-weight: 700; cursor: pointer\">Back<\u002Fbutton>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <h2 style=\"margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15\">Sign in so your helper can reach you<\u002Fh2>\n              <p style=\"margin: 0; font-size: 19px; line-height: 1.45; color: #55514A\">One sign-in keeps your medicine list safe and lets your helper add medicines from their own phone.<\u002Fp>\n            <\u002Fdiv>\n            <sc-if value=\"{{ signinIdle }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.doSignin }}\" style=\"min-height: 72px; border: 2px solid #211F1B; border-radius: 18px; background: #FFFFFF; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px\"><span style=\"width: 26px; height: 26px; border-radius: 999px; background: #1F5340; color: #fff; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center\">G<\u002Fspan>Continue with Google<\u002Fbutton>\n                <p style=\"margin: 0; font-size: 15px; color: #7C766A; line-height: 1.45\">No new password to remember.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ signinLoading }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 18px; background: #F2EEE6; border: 1px solid #DDD7CB\">\n                <span style=\"font-size: 20px; font-weight: 700\">Signing you in…<\u002Fspan>\n                <span style=\"height: 8px; border-radius: 999px; background: #DDD7CB; overflow: hidden; display: block\"><span style=\"display: block; width: 60%; height: 100%; background: #1F5340\"><\u002Fspan><\u002Fspan>\n                <span style=\"font-size: 16px; color: #55514A\">Setting up your household and your sharing code.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ signinError }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 18px; background: #FBEAE5; border: 2px solid #8E2F1E\">\n                <span style=\"font-size: 20px; font-weight: 800; color: #7A2716\">Sign-in did not finish<\u002Fspan>\n                <span style=\"font-size: 17px; line-height: 1.4; color: #45423C\">The connection dropped. Nothing was changed. You can try again.<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.doSignin }}\" style=\"min-height: 60px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 18px; font-weight: 700; cursor: pointer\">Try again<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPair }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; display: flex; align-items: center; padding: 6px 14px 10px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.welcome }}\" style=\"min-height: 44px; padding: 8px 12px; border: none; background: none; color: #2A3B5E; font-size: 16px; font-weight: 700; cursor: pointer\">Back<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 8px 22px 24px; display: flex; flex-direction: column; gap: 20px\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B7280\">Helper setup<\u002Fspan>\n                <h2 style=\"margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2\">Enter the code from their phone<\u002Fh2>\n                <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #4B5563\">Ask them to open Settings on their phone and read you the six-character code. No account needed for you.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <label for=\"code\" style=\"font-size: 14px; font-weight: 700; color: #374151\">Household code<\u002Flabel>\n                <div id=\"code\" style=\"min-height: 68px; border-radius: 14px; border: 2px solid #2A3B5E; background: #FFFFFF; display: flex; align-items: center; padding: 0 18px; font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; letter-spacing: 0.22em; color: #111827\">{{ pairCode }}<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ nav.typeGood }}\" style=\"min-height: 40px; padding: 6px 12px; border: 1px solid #C7CCD6; border-radius: 999px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer\">type a valid code<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ nav.typeBad }}\" style=\"min-height: 40px; padding: 6px 12px; border: 1px solid #C7CCD6; border-radius: 999px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer\">type a wrong code<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ pairInvalid }}\">\n                <div style=\"display: flex; gap: 12px; padding: 16px; border-radius: 14px; background: #FDECE8; border: 1px solid #B14A34\">\n                  <span style=\"font-size: 18px; font-weight: 800; color: #8E2F1E\">✕<\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 16px; font-weight: 700; color: #8E2F1E\">That code was not found<\u002Fspan><span style=\"font-size: 15px; line-height: 1.45; color: #45423C\">Codes are six characters, letters and numbers. Check it with them and try again — or ask them to make a new code in Settings.<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pairFailed }}\">\n                <div style=\"display: flex; gap: 12px; padding: 16px; border-radius: 14px; background: #FFF4E0; border: 1px solid #A6741C\">\n                  <span style=\"font-size: 18px; font-weight: 800; color: #7A5410\">!<\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; gap: 8px\"><span style=\"font-size: 16px; font-weight: 700; color: #7A5410\">Could not connect<\u002Fspan><span style=\"font-size: 15px; line-height: 1.45; color: #45423C\">The code looks right but we could not reach the household. Check your internet and retry.<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ nav.doPair }}\" style=\"min-height: 44px; padding: 8px 16px; border: none; border-radius: 10px; background: #2A3B5E; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; align-self: flex-start\">Retry<\u002Fbutton><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pairLoading }}\">\n                <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #EEF1F6; border: 1px solid #C7CCD6\">\n                  <span style=\"font-size: 16px; font-weight: 700\">Connecting…<\u002Fspan>\n                  <span style=\"height: 6px; border-radius: 999px; background: #D8DCE4; overflow: hidden; display: block\"><span style=\"display: block; width: 45%; height: 100%; background: #2A3B5E\"><\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pairDone }}\">\n                <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; background: #E7F1EA; border: 1px solid #1F5340\">\n                  <span style=\"font-size: 17px; font-weight: 800; color: #1F5340\">✓ Connected to Margaret's household<\u002Fspan>\n                  <span style=\"font-size: 15px; line-height: 1.45; color: #45423C\">You can now add medicines, set times, and follow the day. Marking a dose will always say you are doing it on her behalf.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex: none; padding: 12px 20px 22px; border-top: 1px solid #E1E4EA; background: #fff; display: flex; gap: 10px\">\n              <sc-if value=\"{{ pairDone }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.sToday }}\" style=\"flex: 1; min-height: 58px; border: none; border-radius: 14px; background: #2A3B5E; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer\">Go to Today<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pairNotDone }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.doPair }}\" style=\"flex: 1; min-height: 58px; border: none; border-radius: 14px; background: #2A3B5E; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer\">Connect<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEToday }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; padding: 10px 22px 12px; display: flex; align-items: baseline; gap: 10px\">\n              <span style=\"font-size: 25px; font-weight: 800; letter-spacing: -0.02em\">{{ dateLabel }}<\u002Fspan>\n              <span style=\"margin-left: auto; font-size: 15px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #7C766A\">Today<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ eOffline }}\">\n              <div style=\"flex: none; margin: 0 14px 10px; padding: 10px 14px; border-radius: 12px; background: #FFF4E0; border: 2px solid #A6741C; display: flex; gap: 10px; align-items: center\">\n                <span style=\"font-size: 18px; font-weight: 800; color: #7A5410\">!<\u002Fspan>\n                <span style=\"font-size: 17px; font-weight: 700; line-height: 1.25; color: #45423C\">No internet — your taps are saved here.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ eLoading }}\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 16px\">\n                <span style=\"font-size: 18px; color: #7C766A; padding: 0 4px\">Getting today ready…<\u002Fspan>\n                <span style=\"height: 128px; border-radius: 20px; background: #F2EEE6; border: 1px solid #E4DFD4; display: block\"><\u002Fspan>\n                <span style=\"height: 128px; border-radius: 20px; background: #F4F1EA; border: 1px solid #E4DFD4; display: block\"><\u002Fspan>\n                <span style=\"height: 128px; border-radius: 20px; background: #F7F5EF; border: 1px solid #E4DFD4; display: block\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ eEmpty }}\">\n              <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 16px\">\n                <div style=\"padding: 22px; border-radius: 20px; background: #FFFFFF; border: 2px solid #DDD7CB; display: flex; flex-direction: column; gap: 12px\">\n                  <span style=\"font-size: 24px; font-weight: 800; line-height: 1.2\">No medicines here yet<\u002Fspan>\n                  <span style=\"font-size: 18px; line-height: 1.45; color: #45423C\">Your helper adds your medicines from their own phone. Give them the code below and they can start.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding: 22px; border-radius: 20px; background: #E7F1EA; border: 2px solid #1F5340; display: flex; flex-direction: column; gap: 14px\">\n                  <span style=\"font-size: 16px; font-weight: 700; color: #1F5340\">Your code<\u002Fspan>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 38px; font-weight: 500; letter-spacing: 0.14em; color: #14362a\">{{ code }}<\u002Fspan>\n                  <div style=\"display: flex; gap: 10px\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ onCopyCode }}\" style=\"flex: 1; min-height: 58px; border: 2px solid #1F5340; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">Copy<\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ onShare }}\" style=\"flex: 1; min-height: 58px; border: none; border-radius: 14px; background: #1F5340; color: #FBF9F5; font-size: 17px; font-weight: 700; cursor: pointer\">Send it<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ eNoneDue }}\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px\">\n                <span style=\"width: 56px; height: 56px; border-radius: 999px; background: #E7F1EA; border: 2px solid #1F5340; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #1F5340\">✓<\u002Fspan>\n                <span style=\"font-size: 26px; font-weight: 800; line-height: 1.2\">Nothing to take today<\u002Fspan>\n                <span style=\"font-size: 19px; line-height: 1.45; color: #45423C\">There are no medicines set for today. Your next one is tomorrow morning.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ eNormal }}\">\n              <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 8px 18px 22px; display: flex; flex-direction: column; gap: 22px\">\n                <sc-for list=\"{{ eSlots }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <div style=\"flex: none; border-radius: 22px; background: #FFFFFF; border: 2px solid {{ s.fg }}; box-shadow: 0 4px 0 rgba(28,26,23,0.18); display: flex; flex-direction: column; overflow: hidden\">\n                    <div style=\"flex: none; display: flex; align-items: center; gap: 12px; padding: 11px 20px; background: {{ s.fg }}\">\n                      <span style=\"font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF; white-space: nowrap\">{{ s.name }}<\u002Fspan>\n                      <span style=\"margin-left: auto; font-size: 20px; font-weight: 700; color: #FFFFFF; font-variant-numeric: tabular-nums; white-space: nowrap\">{{ s.t }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex: none; padding: 16px 20px 6px; display: flex; flex-direction: column; gap: 10px\">\n                      <span style=\"font-size: 21px; font-weight: 600; line-height: 1.3; color: #1C1A17; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ s.medNames }}<\u002Fspan>\n                      <span style=\"display: flex; align-items: center; gap: 9px\">\n                        <span style=\"width: 24px; height: 24px; flex: none; border-radius: 999px; border: 2px solid {{ s.fg }}; color: {{ s.fg }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800\">{{ s.glyph }}<\u002Fspan>\n                        <span style=\"font-size: 18px; font-weight: 700; color: {{ s.fg }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ s.statusText }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex: none; display: flex; flex-direction: column; gap: 2px; padding: 10px 16px 8px\">\n                      <sc-if value=\"{{ s.notAllDone }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ s.onMarkAll }}\" style=\"min-height: 54px; border: none; border-radius: 14px; background: #1F5340; color: #FFFFFF; font-size: 18px; font-weight: 800; cursor: pointer\">{{ s.takeLabel }}<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ s.allDone }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ s.onUndoAll }}\" style=\"min-height: 54px; border: 2px solid #7C766A; border-radius: 14px; background: #F1EDE3; font-size: 18px; font-weight: 800; color: #45423C; cursor: pointer\">Undo this<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <button type=\"button\" sc-camel-on-click=\"{{ s.onOpenPage }}\" style=\"min-height: 46px; border: none; background: none; color: #1F5340; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer\">See the pills<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex: none; display: flex; gap: 8px; padding: 10px 14px 18px; border-top: 2px solid #211F1B; background: #FFFFFF\">\n              <sc-for list=\"{{ eNav }}\" as=\"n\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 64px; border: none; border-radius: 16px; font-size: 17px; font-weight: 800; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isESlot }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden\">\n            <div style=\"flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 10px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.eToday }}\" style=\"min-height: 56px; padding: 8px 16px; border: 3px solid #211F1B; border-radius: 14px; background: #FFFFFF; font-size: 19px; font-weight: 800; cursor: pointer\">‹ Today<\u002Fbutton>\n              <span style=\"margin-left: auto; display: flex; flex-direction: column; align-items: flex-end\">\n                <span style=\"font-size: 28px; font-weight: 800; letter-spacing: -0.02em\">{{ pageName }}<\u002Fspan>\n                <span style=\"font-size: 20px; font-weight: 700; color: #45423C\">{{ pageTime }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{ pageMeds }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <div style=\"flex: 1 1 0; min-height: 0; overflow: hidden; border-radius: 20px; background: #FFFFFF; border: 2px solid {{ m.chipFg }}; box-shadow: 0 3px 0 rgba(28,26,23,0.14); display: flex; flex-direction: column; padding: 14px; gap: 11px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ m.onOpen }}\" style=\"flex: 1; min-height: 0; display: flex; align-items: center; gap: 14px; border: none; background: none; padding: 0; cursor: pointer; text-align: left\">\n                    <span style=\"width: 78px; height: 78px; flex: none; border-radius: 14px; border: 2px solid #C5BEAE; background: repeating-linear-gradient(45deg, #F2EEE6 0 6px, #E8E3D8 6px 12px); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C766A; text-align: center\">pill<br>photo<\u002Fspan>\n                    <span style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0\">\n                      <span style=\"font-size: 23px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15\">{{ m.name }} {{ m.strength }}<\u002Fspan>\n                      <span style=\"font-size: 19px; color: #45423C\">{{ m.dose }} · {{ m.purpose }}<\u002Fspan>\n                      <span style=\"font-size: 18px; font-weight: 800; color: {{ m.chipFg }}\">{{ m.glyph }} {{ m.statusLabel }}<\u002Fspan>\n                      <span style=\"font-size: 17px; font-weight: 700; color: #1F5340; text-decoration: underline\">Bigger picture and notes<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ m.notTaken }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onTake }}\" style=\"flex: none; min-height: 60px; border: none; border-radius: 14px; background: #1F5340; color: #FBF9F5; font-size: 20px; font-weight: 800; cursor: pointer\">I have taken this<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.taken }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onClear }}\" style=\"flex: none; min-height: 60px; border: 3px solid #7C766A; border-radius: 14px; background: #FFFFFF; font-size: 19px; font-weight: 800; color: #45423C; cursor: pointer\">Undo — not taken<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.unmarked }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onSkip }}\" style=\"flex: none; min-height: 46px; border: none; background: none; color: #45423C; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer\">Leave this one out today<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.skipped }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onClear }}\" style=\"flex: none; min-height: 46px; border: none; background: none; color: #45423C; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer\">Put it back on the list<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex: none; padding: 0 14px 10px\">\n              <sc-if value=\"{{ pageNotAllDone }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onPageMarkAll }}\" style=\"width: 100%; min-height: 62px; border: 3px solid #1F5340; border-radius: 16px; background: #FFFFFF; color: #1F5340; font-size: 19px; font-weight: 800; cursor: pointer\">{{ pageTakeLabel }} — all of {{ pageName }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pageAllDone }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onPageUndoAll }}\" style=\"width: 100%; min-height: 62px; border: 3px solid #7C766A; border-radius: 16px; background: #FFFFFF; color: #45423C; font-size: 19px; font-weight: 800; cursor: pointer\">Undo all of {{ pageName }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex: none; display: flex; gap: 8px; padding: 10px 14px 18px; border-top: 2px solid #211F1B; background: #FFFFFF\">\n              <sc-for list=\"{{ eNav }}\" as=\"n\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 64px; border: none; border-radius: 16px; font-size: 17px; font-weight: 800; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isESettings }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; padding: 4px 20px 14px\">\n              <span style=\"font-size: 27px; font-weight: 800; letter-spacing: -0.02em\">Settings<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 22px\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #7C766A\">Your account<\u002Fspan>\n                <div style=\"border-radius: 18px; background: #FFFFFF; border: 2px solid #DDD7CB; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n                  <span style=\"font-size: 20px; font-weight: 700\">Margaret Ellis<\u002Fspan>\n                  <span style=\"font-size: 17px; color: #55514A\">margaret.ellis@gmail.com<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"border-radius: 18px; background: #E7F1EA; border: 2px solid #1F5340; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n                  <span style=\"font-size: 17px; font-weight: 700; color: #1F5340\">Code for your helper<\u002Fspan>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 500; letter-spacing: 0.14em; color: #14362a\">{{ code }}<\u002Fspan>\n                  <div style=\"display: flex; gap: 10px\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ onCopyCode }}\" style=\"flex: 1; min-height: 56px; border: 2px solid #1F5340; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">Copy<\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ onShare }}\" style=\"flex: 1; min-height: 56px; border: none; border-radius: 14px; background: #1F5340; color: #FBF9F5; font-size: 17px; font-weight: 700; cursor: pointer\">Send it<\u002Fbutton>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onRotate }}\" style=\"min-height: 52px; border: 2px dashed #A6741C; border-radius: 14px; background: #FFFFFF; color: #7A5410; font-size: 16px; font-weight: 700; cursor: pointer\">Make a new code…<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #7C766A\">Reminders<\u002Fspan>\n                <div style=\"border-radius: 18px; background: #FFFFFF; border: 2px solid #DDD7CB; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{ remBg }}\">\n                    <span style=\"width: 28px; height: 28px; border-radius: 999px; border: 2px solid {{ remFg }}; color: {{ remFg }}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800\">{{ remGlyph }}<\u002Fspan>\n                    <span style=\"font-size: 19px; font-weight: 700; color: {{ remFg }}\">{{ remStatus }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size: 17px; line-height: 1.45; color: #45423C\">{{ remNote }}<\u002Fspan>\n                  <sc-if value=\"{{ remOn }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ onRemToggle }}\" style=\"min-height: 58px; border: 2px solid #B9B2A3; border-radius: 14px; background: #FBF9F5; font-size: 18px; font-weight: 700; cursor: pointer\">Turn reminders off<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ remOff }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ onRemToggle }}\" style=\"min-height: 58px; border: none; border-radius: 14px; background: #1F5340; color: #FBF9F5; font-size: 18px; font-weight: 700; cursor: pointer\">Turn reminders on<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onTestReminder }}\" style=\"min-height: 52px; border: 2px solid #1F5340; border-radius: 14px; background: #FFFFFF; color: #1F5340; font-size: 17px; font-weight: 700; cursor: pointer\">Send me a test reminder<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onTestFail }}\" style=\"min-height: 40px; border: none; background: none; color: #7C766A; font-size: 13px; text-decoration: underline; cursor: pointer\">demo: show a failed reminder<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #7C766A\">How it looks<\u002Fspan>\n                <div style=\"border-radius: 18px; background: #FFFFFF; border: 2px solid #DDD7CB; overflow: hidden; display: flex; flex-direction: column\">\n                  <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.onPick }}\" style=\"min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: none; border-bottom: 1px solid #E4DFD4; cursor: pointer; text-align: left; font-size: 19px; font-weight: 700; background: {{ t.bg }}; color: {{ t.fg }}\"><span style=\"width: 22px; font-weight: 800\">{{ t.glyph }}<\u002Fspan>{{ t.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #7C766A\">About<\u002Fspan>\n                <div style=\"border-radius: 18px; background: #FFFFFF; border: 2px solid #DDD7CB; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n                  <span style=\"font-size: 17px; color: #45423C\">CarePair 2.0 (build 214)<\u002Fspan>\n                  <span style=\"font-size: 16px; line-height: 1.45; color: #55514A\">CarePair helps you remember and recognise your medicines. It does not give medical advice. Ask your doctor or pharmacist about your medicines.<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ nav.how }}\" style=\"min-height: 48px; align-self: flex-start; border: none; background: none; padding: 0; color: #1F5340; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer\">How it works<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ onSignOut }}\" style=\"min-height: 62px; border: 2px solid #8E2F1E; border-radius: 16px; background: #FBF9F5; color: #8E2F1E; font-size: 18px; font-weight: 800; cursor: pointer\">Sign out…<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.welcome }}\" style=\"min-height: 48px; border: none; background: none; color: #7C766A; font-size: 15px; text-decoration: underline; cursor: pointer\">Change role (back to the start)<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: none; display: flex; gap: 8px; padding: 10px 14px 18px; border-top: 2px solid #211F1B; background: #FFFFFF\">\n              <sc-for list=\"{{ eNav }}\" as=\"n\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 64px; border: none; border-radius: 16px; font-size: 17px; font-weight: 800; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isFillStart }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 27px; font-weight: 800; letter-spacing: -0.02em\">Fill the box<\u002Fspan>\n              <span style=\"font-size: 17px; color: #55514A\">Putting next week's pills into the plastic box.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"padding: 14px 16px; border-radius: 14px; background: #EEF1F6; border: 3px solid #2A3B5E; display: flex; gap: 10px; align-items: flex-start\">\n                <span style=\"font-size: 19px; font-weight: 800; color: #2A3B5E\">i<\u002Fspan>\n                <span style=\"font-size: 18px; line-height: 1.35; font-weight: 600; color: #1F2937\">This only fills the plastic box. It does not mean you have taken anything.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border-radius: 18px; background: #FFFFFF; border: 2px solid #DDD7CB; overflow: hidden\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onPickWeek }}\" style=\"width: 100%; min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: none; border-bottom: 1px solid #E4DFD4; background: none; cursor: pointer; text-align: left\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700; color: #7C766A\">Week<\u002Fspan><span style=\"font-size: 20px; font-weight: 700\">{{ weekLabel }}<\u002Fspan><\u002Fspan>\n                  <span style=\"margin-left: auto; font-size: 16px; font-weight: 700; color: #1F5340; text-decoration: underline\">Change<\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onEditBoxTimes }}\" style=\"width: 100%; min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: none; background: none; cursor: pointer; text-align: left\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700; color: #7C766A\">Compartments in the box<\u002Fspan><span style=\"font-size: 20px; font-weight: 700\">{{ boxTimesLabel }}<\u002Fspan><\u002Fspan>\n                  <span style=\"margin-left: auto; font-size: 16px; font-weight: 700; color: #1F5340; text-decoration: underline\">Change<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ fillNoSlots }}\">\n                <div style=\"padding: 18px; border-radius: 16px; background: #FFF4E0; border: 2px solid #A6741C; display: flex; flex-direction: column; gap: 10px\">\n                  <span style=\"font-size: 19px; font-weight: 800; color: #7A5410\">No compartments chosen yet<\u002Fspan>\n                  <span style=\"font-size: 16px; line-height: 1.45; color: #45423C\">Choose at least one time of day that lives in the physical box — usually morning and bedtime.<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onEditBoxTimes }}\" style=\"min-height: 52px; border: none; border-radius: 12px; background: #7A5410; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; align-self: flex-start; padding: 0 18px\">Choose compartments<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ fillNothing }}\">\n                <div style=\"padding: 18px; border-radius: 16px; background: #F2EEE6; border: 2px solid #DDD7CB; display: flex; flex-direction: column; gap: 8px\">\n                  <span style=\"font-size: 19px; font-weight: 800\">Nothing to put in the box this week<\u002Fspan>\n                  <span style=\"font-size: 16px; line-height: 1.45; color: #45423C\">No medicine in the list falls on these days. Try another week, or ask the helper to check the medicine list.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ fillHasWork }}\">\n                <div style=\"padding: 18px; border-radius: 18px; background: #E7F1EA; border: 2px solid #1F5340; display: flex; flex-direction: column; gap: 6px\">\n                  <span style=\"font-size: 22px; font-weight: 800; color: #14362a\">{{ boxCountLabel }}<\u002Fspan>\n                  <span style=\"font-size: 16px; color: #1F5340\">We will show them one at a time, with the pill photo.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ fillResume }}\">\n                <div style=\"padding: 16px; border-radius: 16px; background: #FFFFFF; border: 2px dashed #A6741C; display: flex; flex-direction: column; gap: 10px\">\n                  <span style=\"font-size: 18px; font-weight: 800; color: #7A5410\">You stopped part way on Friday<\u002Fspan>\n                  <span style=\"font-size: 16px; color: #45423C\">2 of 4 medicines were already put in the box.<\u002Fspan>\n                  <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ nav.fillStep }}\" style=\"min-height: 52px; padding: 0 18px; border: none; border-radius: 12px; background: #1F5340; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer\">Carry on<\u002Fbutton>\n                    <button type=\"button\" sc-camel-on-click=\"{{ nav.fillStep }}\" style=\"min-height: 52px; padding: 0 18px; border: 2px solid #B9B2A3; border-radius: 12px; background: #FBF9F5; font-size: 16px; font-weight: 700; cursor: pointer\">Start again<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ onOutside }}\" style=\"min-height: 62px; border: 3px solid #211F1B; border-radius: 14px; background: #FFFFFF; font-size: 18px; font-weight: 800; cursor: pointer; text-align: left; padding: 10px 16px\">2 medicines stay outside the box — see them<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ fillHasWork }}\">\n              <div style=\"flex: none; padding: 12px 16px; border-top: 1px solid #E4DFD4; background: #FBF9F5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.fillStep }}\" style=\"width: 100%; min-height: 64px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 20px; font-weight: 800; cursor: pointer\">Start filling the box<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ roleTaker }}\">\n              <div style=\"flex: none; display: flex; gap: 8px; padding: 10px 14px 18px; border-top: 2px solid #211F1B; background: #FFFFFF\">\n                <sc-for list=\"{{ eNav }}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 64px; border: none; border-radius: 16px; font-size: 17px; font-weight: 800; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ roleSupporter }}\">\n              <div style=\"flex: none; display: flex; gap: 4px; padding: 8px 8px 16px; border-top: 1px solid #E1E4EA; background: #E5E9F0\">\n                <sc-for list=\"{{ sNav }}\" as=\"n\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ n.onPick }}\" style=\"flex: 1; min-height: 52px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFillStep }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; padding: 2px 16px 10px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"display: flex; align-items: center; gap: 10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ nav.fill }}\" style=\"min-height: 44px; padding: 6px 10px; border: none; background: none; color: #1F5340; font-size: 16px; font-weight: 700; cursor: pointer\">Close<\u002Fbutton>\n                <span style=\"margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7C766A\">{{ fillProgress }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"height: 8px; border-radius: 999px; background: #E4DFD4; display: block; overflow: hidden\"><span style=\"display: block; height: 100%; background: #1F5340; width: {{ fillBarWidth }}\"><\u002Fspan><\u002Fspan>\n              <span style=\"font-size: 14px; color: #7C766A\">{{ fillDoneCount }} — this is how far through the job you are, nothing else.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                <span style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1\">{{ curName }} {{ curStrength }}<\u002Fspan>\n                <span style=\"font-size: 19px; font-weight: 600; color: #45423C\">{{ curPurpose }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onCurPill }}\" style=\"flex: 1; height: 130px; border-radius: 16px; border: 1px solid #DDD7CB; background: repeating-linear-gradient(45deg, #F2EEE6 0 8px, #E8E3D8 8px 16px); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #55514A\">pill photo<span style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1F5340; text-decoration: underline\">Tap to enlarge<\u002Fspan><\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ onCurPacket }}\" style=\"flex: 1; height: 130px; border-radius: 16px; border: 1px solid #DDD7CB; background: repeating-linear-gradient(45deg, #EFEAE1 0 8px, #E5E0D4 8px 16px); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #55514A\">packet photo<span style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1F5340; text-decoration: underline\">Tap to enlarge<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 3px solid #DDD7CB; display: flex; flex-direction: column; gap: 12px\">\n                <span style=\"font-size: 24px; font-weight: 800; line-height: 1.2\">{{ curWeekQty }}<\u002Fspan>\n                <span style=\"font-size: 17px; font-weight: 600; color: #55514A\">How many go in each day<\u002Fspan>\n                <div style=\"display: flex; gap: 5px\">\n                  <sc-for list=\"{{ curChips }}\" as=\"c\" hint-placeholder-count=\"7\">\n                    <span style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 10px; background: {{ c.bg }}; border: 2px solid {{ c.line }}\">\n                      <span style=\"font-size: 13px; font-weight: 800; color: #45423C\">{{ c.day }}<\u002Fspan>\n                      <span style=\"font-size: 22px; font-weight: 800; color: {{ c.fg }}\">{{ c.qty }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <span style=\"font-size: 16px; line-height: 1.35; color: #55514A\">{{ curDays }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: none; padding: 10px 16px 18px; border-top: 1px solid #E4DFD4; background: #FBF9F5; display: flex; flex-direction: column; gap: 10px\">\n              <sc-if value=\"{{ curNotFilled }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onFill }}\" style=\"min-height: 64px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 20px; font-weight: 800; cursor: pointer\">It is in the box<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ curFilled }}\">\n                <div style=\"display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #E7F1EA; border: 2px solid #1F5340\"><span style=\"font-size: 18px; font-weight: 800; color: #1F5340\">✓<\u002Fspan><span style=\"font-size: 18px; font-weight: 700; color: #1F5340\">In the box<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ onUndoFill }}\" style=\"margin-left: auto; min-height: 44px; padding: 0 14px; border: 2px solid #1F5340; border-radius: 10px; background: #fff; color: #1F5340; font-size: 15px; font-weight: 700; cursor: pointer\">Undo<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display: flex; gap: 10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onFillBack }}\" style=\"flex: 1; min-height: 56px; border: 2px solid #B9B2A3; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">Back<\u002Fbutton>\n                <sc-if value=\"{{ fillNotLast }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ onFillNext }}\" style=\"flex: 1; min-height: 56px; border: 2px solid #211F1B; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">Next medicine<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ fillIsLast }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ nav.fillCheck }}\" style=\"flex: 1; min-height: 56px; border: 2px solid #211F1B; border-radius: 14px; background: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer\">Check the box<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFillCheck }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n            <div style=\"flex: none; padding: 2px 16px 10px; display: flex; flex-direction: column; gap: 4px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ nav.fillStep }}\" style=\"align-self: flex-start; min-height: 44px; padding: 6px 10px; border: none; background: none; color: #1F5340; font-size: 16px; font-weight: 700; cursor: pointer\">Back to the medicines<\u002Fbutton>\n              <span style=\"font-size: 25px; font-weight: 800; letter-spacing: -0.02em; padding: 0 4px\">Check the box<\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.4; color: #55514A; padding: 0 4px\">Compare each compartment with the tray in front of you. We cannot see the tray, so the last word is yours.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; gap: 6px; padding-left: 62px\">\n                <sc-for list=\"{{ checkSlotHeads }}\" as=\"h\" hint-placeholder-count=\"3\">\n                  <span style=\"flex: 1; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #7C766A; text-align: center\">{{ h.name }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ checkRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                <div style=\"flex: 1 1 0; min-height: 0; display: flex; align-items: stretch; gap: 6px\">\n                  <span style=\"width: 56px; flex: none; display: flex; align-items: center; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums\">{{ r.day }}<\u002Fspan>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ c.onOpen }}\" style=\"flex: 1; min-height: 44px; border: 2px solid #C5BEAE; border-radius: 12px; cursor: pointer; font-size: 22px; font-weight: 800; color: #1C1A17; background: {{ c.bg }}\">{{ c.qty }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <p style=\"margin: 4px 4px 0; font-size: 16px; line-height: 1.35; color: #55514A\">Tap a box to see which pills go in it. “–” means leave it empty.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex: none; padding: 10px 16px 18px; border-top: 1px solid #E4DFD4; background: #FBF9F5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onFinishFill }}\" style=\"width: 100%; min-height: 64px; border: none; border-radius: 16px; background: #1F5340; color: #FBF9F5; font-size: 19px; font-weight: 800; cursor: pointer\">I have finished filling the box<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isSToday }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; background: #E5E9F0\">\n            <div style=\"flex: none; padding: 2px 18px 10px; display: flex; align-items: flex-end; gap: 10px\">\n              <span style=\"display: flex; flex-direction: column\">\n                <span style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7280\">Helping Margaret<\u002Fspan>\n                <span style=\"font-size: 23px; font-weight: 800; letter-spacing: -0.02em\">Sunday 13 Sept<\u002Fspan>\n              <\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onSendReminder }}\" style=\"margin-left: auto; min-height: 44px; padding: 8px 14px; border: 1px solid #2A3B5E; border-radius: 10px; background: #FFFFFF; color: #2A3B5E; font-size: 14px; font-weight: 700; cursor: pointer\">Nudge her phone<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex: none; margin: 0 14px 10px; padding: 10px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E1E4EA; display: flex; align-items: center; gap: 10px\">\n              <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #1F5340; flex: none\"><\u002Fspan>\n              <span style=\"font-size: 14px; color: #374151\">{{ syncLabel }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onRefresh }}\" style=\"margin-left: auto; min-height: 40px; padding: 6px 12px; border: none; background: none; color: #2A3B5E; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer\">Check now<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ sDateDiff }}\">\n              <div style=\"flex: none; margin: 0 14px 10px; padding: 12px 14px; border-radius: 10px; background: #FFF4E0; border: 1px solid #A6741C; display: flex; gap: 10px\">\n                <span style=\"font-size: 15px; font-weight: 800; color: #7A5410\">!<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.45; color: #45423C\">Your phone says Monday 14 September, but Margaret's day is still Sunday 13 September. You are looking at her day.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sSyncFail }}\">\n              <div style=\"flex: none; margin: 0 14px 10px; padding: 12px 14px; border-radius: 10px; background: #FDECE8; border: 1px solid #B14A34; display: flex; flex-direction: column; gap: 8px\">\n                <span style=\"font-size: 14px; font-weight: 700; color: #8E2F1E\">Could not get the latest<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.45; color: #45423C\">You are seeing what was saved 3 hours ago. Marks you make now are saved and sent when the connection is back.<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ onRefresh }}\" style=\"align-self: flex-start; min-height: 40px; padding: 6px 14px; border: none; border-radius: 8px; background: #8E2F1E; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer\">Try again<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ onBehalfActive }}\">\n              <div style=\"flex: none; margin: 0 14px 10px; padding: 8px 12px; border-radius: 999px; background: #EEF1F6; border: 1px dashed #2A3B5E; align-self: flex-start\">\n                <span style=\"font-size: 13px; font-weight: 700; color: #2A3B5E\">Marking on Margaret's behalf this session<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sLoading }}\">\n              <div style=\"flex: 1; padding: 4px 14px; display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"height: 74px; border-radius: 12px; background: #EEF0F4; display: block\"><\u002Fspan>\n                <span style=\"height: 74px; border-radius: 12px; background: #F1F3F6; display: block\"><\u002Fspan>\n                <span style=\"height: 74px; border-radius: 12px; background: #F4F5F8; display: block\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sNormal }}\">\n              <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px\">\n                <sc-for list=\"{{ sSlots }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"border-radius: 12px; background: #FFFFFF; border: 1px solid #E1E4EA; overflow: hidden\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ s.onToggle }}\" style=\"width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px; border: none; background: none; cursor: pointer; text-align: left\">\n                      <span style=\"width: 26px; height: 26px; flex: none; border-radius: 999px; border: 2px solid {{ s.fg }}; color: {{ s.fg }}; background: {{ s.bg }}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800\">{{ s.glyph }}<\u002Fspan>\n                      <span style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0\">\n                        <span style=\"font-size: 17px; font-weight: 700\">{{ s.name }} · {{ s.t }}<\u002Fspan>\n                        <span style=\"font-size: 14px; color: {{ s.fg }}; font-weight: 600\">{{ s.statusText }} · {{ s.count }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #2A3B5E; text-decoration: underline\">{{ s.chevron }}<\u002Fspan>\n                    <\u002Fbutton>\n                    <sc-if value=\"{{ s.open }}\">\n                      <div style=\"display: flex; flex-direction: column\">\n                        <sc-for list=\"{{ s.meds }}\" as=\"m\" hint-placeholder-count=\"2\">\n                          <div style=\"border-top: 1px solid #EEF0F4; padding: 12px 14px; display: flex; align-items: center; gap: 10px\">\n                            <button type=\"button\" sc-camel-on-click=\"{{ m.onOpen }}\" style=\"display: flex; align-items: center; gap: 10px; border: none; background: none; padding: 0; cursor: pointer; text-align: left; flex: 1; min-width: 0\">\n                              <span style=\"width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid #DDE1E8; background: repeating-linear-gradient(45deg, #F3F4F7 0 5px, #E9EBF0 5px 10px)\"><\u002Fspan>\n                              <span style=\"display: flex; flex-direction: column; min-width: 0\">\n                                <span style=\"font-size: 15px; font-weight: 700\">{{ m.name }} {{ m.strength }}<\u002Fspan>\n                                <span style=\"font-size: 13px; color: {{ m.chipFg }}; font-weight: 600\">{{ m.glyph }} {{ m.statusLabel }} · {{ m.dose }}<\u002Fspan>\n                              <\u002Fspan>\n                            <\u002Fbutton>\n                            <sc-if value=\"{{ m.notTaken }}\">\n                              <button type=\"button\" sc-camel-on-click=\"{{ m.onTake }}\" style=\"flex: none; min-height: 40px; padding: 6px 12px; border: none; border-radius: 8px; background: #2A3B5E; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer\">Mark taken<\u002Fbutton>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ m.taken }}\">\n                              <button type=\"button\" sc-camel-on-click=\"{{ m.onClear }}\" style=\"flex: none; min-height: 40px; padding: 6px 12px; border: 1px solid #C7CCD6; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 700; cu
