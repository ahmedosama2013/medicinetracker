<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community photo review</title>
<style>
:root{--ink:#18212f;--muted:#6f7b8d;--line:#e6eaf0;--blue:#2167d5;--blue-soft:#edf4ff;--green:#16845b;--red:#bd4753;--bg:#f6f8fb;--card:#fff;--shadow:0 14px 40px #1b31530d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1320px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:750;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:4px 0;font-size:30px;letter-spacing:-.03em}.top p{margin:0;color:var(--muted)}.settings{display:flex;gap:8px;flex-wrap:wrap}.settings input{width:230px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white}.btn{padding:10px 14px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.count{color:var(--muted);margin-left:auto}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.panel,.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.list{padding:8px;max-height:calc(100vh - 180px);overflow:auto}.item{display:block;width:100%;text-align:left;background:transparent;padding:14px;border-radius:13px;margin:2px 0}.item:hover,.item.active{background:var(--blue-soft)}.item-title{font-weight:750}.item-meta,.item-sub{color:var(--muted);font-size:13px;margin-top:3px}.status{display:inline-flex;font-size:11px;font-weight:750;padding:3px 8px;border-radius:99px;margin-top:8px;text-transform:capitalize}.status.pending{background:#fff2d7;color:#946511}.status.approved{background:#e4f7ed;color:var(--green)}.status.rejected{background:#fdebed;color:var(--red)}.detail{padding:28px;min-height:550px}.empty{display:grid;place-items:center;min-height:460px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:18px}.heading h2{margin:0;font-size:25px}.heading p{margin:5px 0 0;color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.fact{background:var(--bg);border-radius:12px;padding:12px}.fact label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.photo-card{border:1px solid var(--line);border-radius:14px;padding:12px}.photo-card h3{margin:0 0 10px;font-size:14px}.photo-card img{display:block;width:100%;height:250px;object-fit:contain;background:#f1f4f8;border-radius:10px}.photo-card .missing{height:250px;display:grid;place-items:center;background:#f4f6f9;border-radius:10px;color:var(--muted)}.actions{display:flex;gap:10px;margin-top:24px}.approve{background:var(--green)}.reject{background:var(--red)}.note{margin-top:12px;color:var(--muted);font-size:13px}.error{background:#fff0f1;color:var(--red);padding:12px;border-radius:10px;margin-bottom:15px;display:none}@media(max-width:850px){.shell{padding:16px}.top{display:block}.settings{margin-top:16px}.layout{grid-template-columns:1fr}.list{max-height:300px}.facts{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">Developer tools</div><h1>Community photo review</h1><p>Review proposed improvements to shared medicine photos.</p></div><div class="settings"><input id="url" placeholder="Supabase URL"><input id="token" type="password" placeholder="Review token"><button class="btn" id="connect">Connect</button></div></header>
<div class="error" id="error"></div>
<div class="toolbar"><select id="filter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All suggestions</option></select><button class="btn secondary" id="refresh">Refresh</button><span class="count" id="count"></span></div>
<section class="layout"><aside class="panel list" id="list"><div class="empty"><div><strong>Connect to Supabase</strong>Enter the project URL and review token above.</div></div></aside><article class="detail" id="detail"><div class="empty"><div><strong>Select a suggestion</strong>Review requests will appear here.</div></div></article></section>
</main>
<script>
const $=id=>document.getElementById(id), state={rows:[],selected:null,url:localStorage.reviewUrl||'',token:''}; $('url').value=state.url;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(message){$('error').textContent=message;$('error').style.display='block'} function clearError(){$('error').style.display='none'}
async function api(action,payload={}){const r=await fetch(state.url.replace(/\/$/,'')+'/functions/v1/community-review',{method:'POST',headers:{'Content-Type':'application/json','x-review-token':state.token},body:JSON.stringify({action,...payload})});if(!r.ok)throw Error(r.status+' '+await r.text());return r.json()}
async function load(){clearError();$("connect").disabled=true;$("refresh").disabled=true;$("connect").textContent="Loading…";if(!state.url||!state.token){$("connect").disabled=false;$("refresh").disabled=false;$("connect").textContent="Connect";return fail("Enter the Supabase URL and review token first.")}try{const result=await api("list");state.rows=result.suggestions||[];renderList()}catch(e){fail("Could not load suggestions: "+e.message)}finally{$("connect").disabled=false;$("refresh").disabled=false;$("connect").textContent="Connect"}}
function filtered(){const f=$('filter').value;return f==='all'?state.rows:state.rows.filter(r=>r.status===f)}
function renderList(){const rows=filtered();$('count').textContent=rows.length+' request'+(rows.length===1?'':'s');$('list').innerHTML=rows.length?rows.map((r,i)=>`<button class="item ${state.selected===r.id?'active':''}" data-id="${esc(r.id)}"><div class="item-title">${esc(r.community_medicine_references?.name||'Unknown medicine')}</div><div class="item-meta">${esc(r.community_medicine_references?.strength||'')} · ${esc(r.kind)}</div><div class="item-sub">${new Date(r.created_at).toLocaleString()}</div><span class="status ${esc(r.status)}">${esc(r.status)}</span></button>`).join(''):'<div class="empty"><div><strong>No suggestions</strong>Nothing matches this filter.</div></div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>show(x.dataset.id));if(state.selected&&!rows.some(r=>r.id===state.selected))$('detail').innerHTML='<div class="empty"><div><strong>Select a suggestion</strong>Choose a request from the list.</div></div>'}
async function show(id){state.selected=id;renderList();const r=state.rows.find(x=>x.id===id);if(!r)return;const ref=r.community_medicine_references||{};$('detail').innerHTML='<div class="heading"><div><h2>'+esc(ref.name||"Unknown medicine")+' '+esc(ref.strength||"")+'</h2><p>Photo replacement request · '+esc(r.kind)+'</p></div><span class="status '+esc(r.status)+'">'+esc(r.status)+'</span></div><div class="facts"><div class="fact"><label>Submitted by</label><span>'+esc(r.submitted_by_name||r.submitted_by_household_id||"Not recorded")+'</span></div><div class="fact"><label>Submitted</label><span>'+new Date(r.created_at).toLocaleString()+'</span></div><div class="fact"><label>Photo type</label><span>'+esc(r.kind)+'</span></div></div><div class="photos"><div class="photo-card"><h3>Current community photo</h3>'+ (r.old_photo_url?'<img src="'+esc(r.old_photo_url)+'" alt="Current community photo">':'<div class="missing">No current photo</div>')+'</div><div class="photo-card"><h3>Suggested replacement</h3>'+ (r.new_photo_url?'<img src="'+esc(r.new_photo_url)+'" alt="Suggested replacement">':'<div class="missing">Photo unavailable</div>')+'</div></div>'+(true?'<div class="actions"><button class="btn approve" id="approve">Approve replacement</button><button class="btn reject" id="reject">Reject request</button></div>':"");if(true){$('approve').onclick=()=>review(r,"approved");$('reject').onclick=()=>review(r,"rejected")}}
async function review(r,status){if(!confirm((status==='approved'?'Approve':'Reject')+' this photo suggestion?'))return;try{$('approve').disabled=true;$('reject').disabled=true;$('approve').textContent='Saving…';await api('review',{id:r.id,status});await load();show(r.id)}catch(e){fail('Could not update suggestion: '+e.message)}}
$('connect').onclick=()=>{state.url=$('url').value.trim();state.token=$('token').value.trim();localStorage.reviewUrl=state.url;load()};$('refresh').onclick=load;$('filter').onchange=renderList;
</script>
</body></html>
